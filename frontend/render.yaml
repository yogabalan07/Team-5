# render.yaml - Place in frontend root
services:
  - type: web
    name: inventory-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://ivm-backend-5tmk.onrender.com/api
