services:
  - type: web
    name: inventory-pro-frontend
    env: static
    buildCommand: npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://ivm-backend-5tmk.onrender.com/api
